name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.runner }} / ${{ matrix.python-version }} / ${{ matrix.native-ext && 'ext' || 'standard' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - macos-15
          - windows-2025
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.14t"
          - "3.15"
          - "3.15t"
        native-ext: [true, false]
        exclude:
          # Currently many dependencies need wheel builds on 3.15 which is slow, so only run on push
          - python-version: ${{ github.event_name == 'pull_request' && '3.15' }}
          - python-version: ${{ github.event_name == 'pull_request' && '3.15t' }}
    env:
      # When bumping, also bump top-level env in release.yaml
      MATURIN_ARGS: ${{ (matrix.python-version == '3.10' || matrix.python-version == '3.11') && '--features pyo3/abi3-py310' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv with Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          python-version: ${{ matrix.python-version }}
      - name: Setup rust
        if: matrix.native-ext
        run: rustup update
      - run: uv sync --locked

      - name: Build conformance test runner (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          USE_BAZEL_VERSION: "8.6.0"
        run: |
          git clone --depth 1 --branch windows-conformance https://github.com/anuraaga/protobuf.git "$env:RUNNER_TEMP/protobuf"
          cd "$env:RUNNER_TEMP/protobuf"
          bazel build //conformance:conformance_test_runner
          Copy-Item bazel-bin/conformance/conformance_test_runner.exe "$env:GITHUB_WORKSPACE/.venv/Lib/site-packages/protoc/_bin/"
          bazel shutdown

      - name: lint protobuf-py-ext
        if: matrix.native-ext
        run: uv run poe ext-lint
      - name: build protobuf-py-ext
        if: matrix.native-ext
        run: uv run poe ext-build
      - run: uv run poe test
        env:
          ASSERT_MARSHALER_IMPLEMENTATION: ${{ matrix.native-ext && 'native' || 'python' }}

  test-pypy:
    name: ${{ matrix.os }} / ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}-latest
    strategy:
      fail-fast: false
      matrix:
        # PyPy seems to have possible flaky hangs on Windows related to subprocess invocation
        # which many of our tests use. We go ahead and skip Windows for now.
        os: [Ubuntu, MacOS]
        python-version:
          - "pypy3.11"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv with Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run poe test
        env:
          ASSERT_MARSHALER_IMPLEMENTATION: python

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          python-version: "3.10"
      - run: uv sync --locked
      - run: uv run poe lint
      - run: uv run poe format
      - run: uv run poe generate
      - run: uv run poe bootstrap
      - run: uv run poe diffcheck
